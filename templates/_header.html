{# Rendered inside play_mp4.html. The video id is carried on a data attribute
   rather than interpolated into JavaScript: Jinja's autoescaping is HTML
   escaping, which is the wrong escaping for a script context. #}
<div class="header" data-video-id="{{ video_id }}">
    <button type="button" id="back-button">Go Back</button>
    <div class="video-title">{{ video_title }}</div>
    <div class="video-actions">
        <button type="button" id="rename-button">Rename</button>
        <button type="button" id="delete-button">Delete</button>
        <button type="button" id="thumbnail-button">Thumbnail</button>
    </div>
</div>

<script>
    (function () {
        const header = document.querySelector('.header');
        const videoId = header.dataset.videoId;

        document.getElementById('back-button').addEventListener('click', function () {
            window.history.back();
        });

        document.getElementById('rename-button').addEventListener('click', async function () {
            const newName = prompt('Enter new name for the video:');
            if (!newName) {
                return;
            }
            try {
                const response = await fetch(`/api/videos/${encodeURIComponent(videoId)}/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: newName, description: '', tags: [] })
                });
                if (!response.ok) {
                    const problem = await response.json().catch(() => ({}));
                    throw new Error(problem.detail || 'Rename failed.');
                }
                window.location.href = '/';
            } catch (error) {
                alert(error.message);
            }
        });

        document.getElementById('delete-button').addEventListener('click', async function () {
            if (!confirm('Delete this video? This cannot be undone.')) {
                return;
            }
            try {
                const response = await fetch(`/api/videos/${encodeURIComponent(videoId)}`, {
                    method: 'DELETE'
                });
                if (!response.ok) {
                    const problem = await response.json().catch(() => ({}));
                    throw new Error(problem.detail || 'Delete failed.');
                }
                window.location.href = '/';
            } catch (error) {
                alert(error.message);
            }
        });
    })();
</script>

<style>
  .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 10px;
      background-color: #1a1a1a;
      color: white;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      box-sizing: border-box;
  }
  #back-button {
      flex: 0 0 auto;
      margin-right: 10px;
  }
  .video-title {
      flex: 1 1 auto;
      min-width: 0;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
  }
  .video-actions {
      flex: 0 0 auto;
      display: flex;
      gap: 10px;
      margin-left: 10px;
  }
  button {
      padding: 8px 16px;
      background-color: #333;
      color: white;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      border-radius: 5px;
  }
  button:hover {
      background-color: #444;
  }
  button:focus-visible {
      outline: 2px solid #4CAF50;
      outline-offset: 2px;
  }
  button:disabled {
      opacity: .6;
      cursor: not-allowed;
  }
</style>
