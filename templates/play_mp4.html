<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>{{ video_title }} - Streaming</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background-color: #2b2b2b;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .video-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 60px 10px 10px;
            box-sizing: border-box;
        }
        video {
            width: 100%;
            max-width: 960px;
            max-height: calc(100vh - 80px);
            height: auto;      /* was a fixed 540px, which distorted on narrow screens */
            outline: none;
            background: #000;
        }
    </style>
</head>
<body>
    {% include '_header.html' %}
    <div class="video-container">
        <video id="my-video" controls preload="metadata" loop playsinline
               {% if has_subtitles %}crossorigin="anonymous"{% endif %}>
            <source src="/videos/{{ video_id }}" type="video/mp4">
            {% if has_subtitles %}
            {# Served as WebVTT whatever the sidecar file on disk actually is. #}
            <track kind="subtitles" label="Subtitles" srclang="en" default
                   src="/videos/{{ video_id }}/subtitles">
            {% endif %}
            Your browser does not support the video tag.
        </video>
    </div>
    <script>
      (function () {
          const video = document.getElementById('my-video');
          const nav = window.streamserver || {};

          // Shortcuts are ignored while a text field has focus, so typing a
          // title in the edit dialog does not seek the video underneath it.
          function isTyping(target) {
              if (!target) {
                  return false;
              }
              const tag = target.tagName;
              return tag === 'INPUT' || tag === 'TEXTAREA' || target.isContentEditable;
          }

          const SEEK_SECONDS = 5;
          const VOLUME_STEP = 0.1;

          document.addEventListener('keydown', function (event) {
              if (isTyping(event.target) || event.metaKey || event.ctrlKey || event.altKey) {
                  return;
              }

              const actions = {
                  ' ': () => (video.paused ? video.play() : video.pause()),
                  k: () => (video.paused ? video.play() : video.pause()),
                  ArrowRight: () => { video.currentTime += SEEK_SECONDS; },
                  ArrowLeft: () => { video.currentTime -= SEEK_SECONDS; },
                  ArrowUp: () => { video.volume = Math.min(1, video.volume + VOLUME_STEP); },
                  ArrowDown: () => { video.volume = Math.max(0, video.volume - VOLUME_STEP); },
                  m: () => { video.muted = !video.muted; },
                  f: () => {
                      if (document.fullscreenElement) {
                          document.exitFullscreen();
                      } else if (video.requestFullscreen) {
                          video.requestFullscreen();
                      }
                  },
                  n: () => { if (nav.nextUrl) { window.location.href = nav.nextUrl; } },
                  p: () => { if (nav.previousUrl) { window.location.href = nav.previousUrl; } },
                  Escape: () => {
                      if (!document.fullscreenElement) {
                          window.location.href = nav.backUrl || '/';
                      }
                  }
              };

              const action = actions[event.key];
              if (action) {
                  // Space would scroll and the arrows would move the page;
                  // the video is the only thing that should respond here.
                  event.preventDefault();
                  action();
              }
          });
      })();

      (function () {
          const button = document.getElementById('thumbnail-button');
          const videoId = document.querySelector('.header').dataset.videoId;

          button.addEventListener('click', async function () {
              button.disabled = true;
              try {
                  const video = document.getElementById('my-video');
                  const seconds = Math.max(0, Math.floor(video.currentTime));
                  const pad = (value) => String(value).padStart(2, '0');
                  const timecode = `${pad(Math.floor(seconds / 3600))}:${pad(Math.floor((seconds % 3600) / 60))}:${pad(seconds % 60)}`;

                  const response = await fetch(
                      `/api/videos/${encodeURIComponent(videoId)}/thumbnail?time=${encodeURIComponent(timecode)}`,
                      { method: 'POST' }
                  );
                  if (!response.ok) {
                      const problem = await response.json().catch(() => ({}));
                      throw new Error(problem.detail || 'Thumbnail generation failed.');
                  }
                  window.location.href = document.querySelector('.header').dataset.backUrl || '/';
              } catch (error) {
                  alert(error.message);
              } finally {
                  button.disabled = false;
              }
          });
      })();
  </script>
</body>
</html>
